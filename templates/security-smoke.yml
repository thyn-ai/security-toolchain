# Ultralight security gate for repositories without application code.
# Managed by thyn-ai/security-toolchain (propagate bumps the pin).
# `merge_group` keeps the gate a valid required check behind a merge queue.
name: security

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    uses: thyn-ai/security-toolchain/.github/workflows/security-smoke.yml@{sha} # {tag}
    permissions:
      contents: read
    with:
      mode: {mode}
