# Reusable authoritative security gate.
#
# Call it from a repository's .github/workflows/security.yml:
#
#   on:
#     pull_request:
#     merge_group:
#     push: { branches: [main] }
#   jobs:
#     full:
#       uses: thyn-ai/security-toolchain/.github/workflows/security-full.yml@<sha> # vX.Y.Z
#       permissions: { contents: read, security-events: write, pull-requests: read, actions: read }
#       with: { overlay: python-uv, mode: advisory }
#
# It re-runs exactly the policy the pre-push hooks run on a laptop, on a clean checkout, on
# a standard GitHub-hosted runner. Scope on pull requests, on merge groups (the same pull
# request one step later: `merge_group.base_sha`...`head_sha`) and on pushes to non-default
# branches is the changed-file list (fail-closed to a full scan); pushes to the default
# branch and the weekly schedule always scan everything. `thyn-sec changed-files` enforces
# the default-branch rule itself (not the checkout depth): GitHub closes every code-scanning
# alert missing from the newest SARIF upload for a ref+category, so a partial upload for
# the default branch would close alerts in untouched files and reopen them later.
#
# The toolchain this runs is this very commit. The job reads the commit and repository of the
# workflow file that defines it out of the job context (`job.workflow_sha`,
# `job.workflow_repository`: the ref the caller pinned, resolved), checks exactly that out and
# installs it through the composite action in that checkout. There is no version literal to
# bump at release time and nothing a pin checker reads as unpinned; tests/test_self_reference.py
# holds the shape.
name: security-full

on:
  workflow_call:
    inputs:
      overlay:
        description: "Opengrep rule-pack overlay: python-uv | site | python-javascript | engine | codna | smoke (pnpm-monorepo = alias of python-javascript). Selects Opengrep packs only; osv-scanner, trivy config and gitleaks scan the whole tree whatever the overlay."
        type: string
        default: python-uv
      mode:
        description: "advisory (report only) | ratchet (fail on NEW high/critical vs security/baseline)"
        type: string
        default: advisory
      tools:
        description: "Comma list of owner tools to run"
        type: string
        default: gitleaks,opengrep,osv,trivy
      runner_json:
        description: "JSON array of runner labels. Standard GitHub-hosted only; billed labels are refused."
        type: string
        default: '["ubuntu-latest"]'
      measure_baseline:
        description: "Write security/baseline/*.txt from a full scan and upload them as an artifact"
        type: boolean
        default: false
      opengrep_upload_audit:
        description: "Also upload Opengrep audit / low-confidence results (LOW CONFIDENCE tag, *.audit.* or *-audit ids) to code scanning as warnings. Default: they stay in the console summary and the reports artifact only."
        type: boolean
        default: false
      opengrep_scan_tests:
        description: "Also run Opengrep over test code: **/tests/**, **/test/**, **/__tests__/**, test_*.py, *_test.py, conftest.py, *.test.ts|tsx|js, *.spec.ts|tsx|js, **/testdata/**, **/fixtures/**. Default: test paths are out of scope for the gate and for code scanning alike -- what SAST finds there is the fixture (a hard-coded test JWT secret, decode-without-verify on a token the test signed), not a defect. true lifts this toolchain's exclusion only; Opengrep's built-in .semgrepignore still skips tests/ and test/ (on full scans and, because --force-exclude applies it to named files too, on PR-scoped runs) unless the repository has a .semgrepignore of its own (an empty one is enough)."
        type: boolean
        default: false
      python_version:
        type: string
        default: "3.12"

permissions: {}

jobs:
  scan:
    name: security gate
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      pull-requests: read
      actions: read # SARIF upload needs it while the calling repository is private
    env:
      THYN_SEC_QUIET: "1"
    steps:
      - name: Refuse billed or self-hosted runner labels
        env:
          RUNNER_JSON: ${{ inputs.runner_json }}
        run: |
          case "$RUNNER_JSON" in
            *-core*|*thyn-*|*larger*|*self-hosted*|*blacksmith*)
              echo "::error title=thyn-sec::security-full runs on standard GitHub-hosted runners only (got $RUNNER_JSON)"
              exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Locate the toolchain commit this workflow runs from
        # `job.workflow_sha` and `job.workflow_repository` describe the reusable workflow file
        # that defines this job -- the ref the caller pinned, resolved to a commit -- where the
        # `github` context keeps describing the caller. Read through toJSON(job): the pinned
        # actionlint (1.7.12) predates these job properties. Anything but a 40-hex commit and an
        # owner/repository name refuses to go on rather than install an unknown toolchain. The
        # output is named for what it is, a revision: CodeQL's untrusted-checkout heuristic reads
        # a checkout `ref` field called sha/head/commit/ref as a pull-request head by name alone.
        id: self
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          set -euo pipefail
          revision="$(jq -r '.workflow_sha // empty' <<<"$JOB_CONTEXT")"
          repository="$(jq -r '.workflow_repository // empty' <<<"$JOB_CONTEXT")"
          if ! [[ "$revision" =~ ^[0-9a-f]{40}$ && "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error title=thyn-sec::cannot locate this workflow's own commit (job.workflow_repository=${repository:-unset}, job.workflow_sha=${revision:-unset}); refusing to install an unknown toolchain"
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"

      - name: Fetch the toolchain at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.self.outputs.repository }}
          ref: ${{ steps.self.outputs.revision }}
          path: .thyn-sec-toolchain
          persist-credentials: false

      - name: Set up thyn-sec
        id: setup
        uses: ./.thyn-sec-toolchain
        with:
          python-version: ${{ inputs.python_version }}

      - name: Park the toolchain source outside the scanned tree
        # A local action has to live under the workspace, and the scanners must never see it
        # (its fixtures are deliberate findings). It comes back in the last step: the composite
        # action's post steps -- the scanner-cache save -- read its action.yml at job end.
        run: mv "$GITHUB_WORKSPACE/.thyn-sec-toolchain" "$RUNNER_TEMP/thyn-sec-source"

      - name: Verify pins
        env:
          EXPECT_REF: ${{ steps.self.outputs.revision }}
        run: thyn-sec verify-toolchain --expect-ref "$EXPECT_REF"

      - name: Derive changed files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: thyn-sec changed-files --output "$RUNNER_TEMP/thyn-sec/changed.txt"

      - name: Scan and gate
        id: scan
        env:
          OVERLAY: ${{ inputs.overlay }}
          MODE: ${{ inputs.mode }}
          TOOLS: ${{ inputs.tools }}
          MEASURE: ${{ inputs.measure_baseline }}
          UPLOAD_AUDIT: ${{ inputs.opengrep_upload_audit }}
          SCAN_TESTS: ${{ inputs.opengrep_scan_tests }}
        run: |
          set -o pipefail
          args=(ci --overlay "$OVERLAY" --mode "$MODE" --tools "$TOOLS"
                --changed "$RUNNER_TEMP/thyn-sec/changed.txt" --out-dir "$RUNNER_TEMP/thyn-sec/out")
          if [ "$MEASURE" = "true" ]; then args+=(--measure-baseline); fi
          if [ "$UPLOAD_AUDIT" = "true" ]; then args+=(--opengrep-upload-audit); fi
          if [ "$SCAN_TESTS" = "true" ]; then args+=(--opengrep-scan-tests); fi
          thyn-sec "${args[@]}"

      # SARIF goes to code scanning on every event but a pull request from a fork, whose token
      # cannot write it. A merge group carries no `pull_request` in its payload and uploads.
      - name: Upload Opengrep SARIF
        # opengrep_sarif names the code-scanning copy: audit / low-confidence results are dropped from
        # it unless opengrep_upload_audit is true. The full opengrep.sarif stays in the reports artifact.
        if: ${{ always() && steps.scan.outputs.opengrep_sarif != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true) }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        continue-on-error: true
        with:
          sarif_file: ${{ steps.scan.outputs.opengrep_sarif }}
          category: thyn-sec/opengrep

      - name: Upload Trivy SARIF
        if: ${{ always() && steps.scan.outputs.trivy_sarif != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true) }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        continue-on-error: true
        with:
          sarif_file: ${{ steps.scan.outputs.trivy_sarif }}
          category: thyn-sec/trivy

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thyn-sec-reports
          path: ${{ runner.temp }}/thyn-sec/out
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload measured baseline
        if: ${{ inputs.measure_baseline && steps.scan.outputs.baseline_files != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-baseline
          path: security/baseline/
          retention-days: 30

      - name: How to commit the measured baseline
        if: ${{ inputs.measure_baseline }}
        env:
          FILES: ${{ steps.scan.outputs.baseline_files }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo
            echo "#### Commit this baseline"
            echo
            echo 'Measured on CI (this run). Download and commit it as-is -- never edit by hand:'
            echo
            echo '```bash'
            echo "gh run download $RUN_ID -R $REPO -n security-baseline -D security/baseline"
            echo "git add security/baseline && git commit -m 'security: measured baseline (run $RUN_ID)'"
            echo '```'
            echo
            echo "Files: ${FILES:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Return the toolchain source for the action's post steps
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/thyn-sec-source" ]; then
            mv "$RUNNER_TEMP/thyn-sec-source" "$GITHUB_WORKSPACE/.thyn-sec-toolchain"
          fi
