# Ultralight gate for repositories with no application code to speak of (issue trackers,
# single-file actions, sites without a lint step): secrets in the working tree + pin
# consistency, in well under three minutes. Fork-PR safe (read-only token, no SARIF upload).
name: security-smoke

on:
  workflow_call:
    inputs:
      mode:
        description: "advisory (report only) | ratchet (any secret fails)"
        type: string
        default: advisory
      runner_json:
        type: string
        default: '["ubuntu-latest"]'
      toolchain_ref:
        description: >-
          Ref (tag or commit SHA) of thyn-ai/security-toolchain to install for this run. Set it
          to the SAME ref this file itself is pinned at in the caller's `uses:` line -- propagate
          keeps both in sync on every bump. Defaults to v0.1.1 so callers pinned before this
          input existed keep their exact current behavior with no action required.
        type: string
        default: v0.1.1

permissions: {}

jobs:
  smoke:
    name: security smoke
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: 3
    permissions:
      contents: read
    env:
      THYN_SEC_QUIET: "1"
    steps:
      - name: Refuse billed or self-hosted runner labels
        env:
          RUNNER_JSON: ${{ inputs.runner_json }}
        run: |
          case "$RUNNER_JSON" in
            *-core*|*thyn-*|*larger*|*self-hosted*|*blacksmith*)
              echo "::error title=thyn-sec::security-smoke runs on standard GitHub-hosted runners only (got $RUNNER_JSON)"
              exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # `uses:` cannot take a dynamic value (confirmed by actionlint: "context 'inputs' is not
      # allowed here") -- see security-full.yml's identical comment for the full explanation.
      # No prefetch step here: gitleaks is the only tool this gate runs, and hooks.gitleaks()
      # already fetches+verifies it lazily on first use.
      - name: Check out thyn-ai/security-toolchain at the pinned ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: thyn-ai/security-toolchain
          ref: ${{ inputs.toolchain_ref }}
          path: .thyn-sec-src
          persist-credentials: false

      - name: Set up Python for thyn-sec
        id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          update-environment: false

      - name: Install thyn-sec
        id: setup
        env:
          PY: ${{ steps.py.outputs.python-path }}
          REF: ${{ inputs.toolchain_ref }}
        run: |
          set -euo pipefail
          "$PY" -m venv "$RUNNER_TEMP/thyn-sec-venv"
          "$RUNNER_TEMP/thyn-sec-venv/bin/python" -m pip install --quiet --disable-pip-version-check "$GITHUB_WORKSPACE/.thyn-sec-src"
          echo "$RUNNER_TEMP/thyn-sec-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/thyn-sec-venv/bin/thyn-sec" --version
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Verify pins
        env:
          EXPECT_REF: ${{ steps.setup.outputs.ref }}
        run: thyn-sec verify-toolchain --expect-ref "$EXPECT_REF"

      - name: Secrets scan
        env:
          MODE: ${{ inputs.mode }}
        run: thyn-sec ci --tools gitleaks --overlay smoke --mode "$MODE" --changed ALL --out-dir "$RUNNER_TEMP/thyn-sec/out"
