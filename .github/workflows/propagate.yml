# Fan a toolchain release out to every repository in fleet.json as a pull request that
# touches only the marker-delimited pre-commit block and the caller workflow pin.
#
# Credentials, in order of preference. The `secrets` context is not visible to job- or
# step-level `if:`, but it is visible to step `env:` expressions, so the `creds` step tests
# presence there (`${{ secrets.X != '' }}`): two booleans reach its shell, no secret value
# does, and it exports a `mode` output that every later step gates on. Secret values then
# reach exactly two consumers -- the App id + key go to the token-mint action (mode app), and
# the PAT is placed in the Propagate step's env only when the mode is pat:
#
#   app   ALGENTA_SDK_SYNC_APP_ID + ALGENTA_SDK_SYNC_APP_PRIVATE_KEY -- the org's release App,
#         under the same secret names algenta-integrations/auto-release.yml uses. A short-lived
#         installation token is minted per run, narrowed to contents / pull-requests / workflows
#         write + metadata read, and the fan-out commits are authored by the App's bot user.
#   pat   TOOLCHAIN_PROPAGATE_TOKEN -- a fine-grained PAT with the same three permissions on the
#         fleet repositories; commits carry propagate.py's default author.
#   none  neither -- the job says so (::notice + step summary) and exits 0, so a release is
#         never blocked on fan-out. This was every run through v0.1.10: the secret never
#         existed, so each release was fanned out from a laptop instead.
#
# The default GITHUB_TOKEN cannot do this job: enterprise policy forbids Actions from creating
# pull requests with it, and a token without `workflows` cannot push the
# .github/workflows/security.yml pin bump at all. README: "Running propagate from GitHub Actions".
#
# `release: published` fires for a tag on ANY commit, so before anything from the checkout is
# executed the job asks the compare API (default token; the checkout is shallow) whether the
# tagged commit is reachable from main, and refuses otherwise -- a tag on an unreviewed commit
# would otherwise fan that commit's scripts/propagate.py out to every fleet repository with
# the org token. The tag must also equal the commit's __version__.
name: propagate

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Toolchain tag to propagate (default: latest release)"
        type: string
        default: ""
      repos:
        description: "Comma list of repos to limit to (default: all in fleet.json)"
        type: string
        default: ""
      dry_run:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  propagate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Refuse to fan out a release whose __version__ doesn't match its own tag
        # Two refusals, both release-trigger only (a workflow_dispatch re-propagating an
        # older --tag is checking out today's main, not that tag's commit).
        #
        # 1. The tagged commit must be reachable from main. `release: published` fires for a
        #    tag on ANY commit, and this job goes on to execute that commit's
        #    scripts/propagate.py against every fleet repository with the org token -- so a
        #    tag on an unreviewed commit would fan unreviewed code out fleet-wide. The
        #    checkout is shallow, so local ancestry is unavailable; the compare API answers
        #    instead. `identical` and `behind` both mean GITHUB_SHA is an ancestor of main;
        #    `ahead` and `diverged` mean it is not. This runs before the __version__ import
        #    below, which is the first thing here that executes code from the checkout.
        # 2. This commit's __version__ must equal the tag being published. It caught nothing
        #    until v0.1.2 shipped with __version__ still reading "0.1.1" -- every caller
        #    pinned to that tag would have had verify-toolchain fail forever, for a reason
        #    invisible in the diff.
        if: ${{ github.event_name == 'release' }}
        env:
          TAG: ${{ github.event.release.tag_name }}
          # the read-only default token; the compare endpoint needs nothing more
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          compare_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" --jq .status)"
          case "$compare_status" in
            identical|behind) ;;
            *)
              echo "::error title=propagate::release $TAG is tagged on $GITHUB_SHA, which is not on main (compare status: $compare_status) -- releases must be cut from a commit already merged to main"
              exit 1
              ;;
          esac
          installed="v$(python -c 'from thyn_security_toolchain import __version__; print(__version__)')"
          if [ "$installed" != "$TAG" ]; then
            echo "::error title=propagate::release $TAG published but thyn_security_toolchain.__version__ is $installed -- fix and re-release before fan-out runs"
            exit 1
          fi

      - name: Decide which credentials this run has
        id: creds
        # Presence is tested in the expression layer, where the `secrets` context IS
        # available (it is only `if:` that cannot see it). Two booleans reach this shell;
        # the secret values themselves never enter the process.
        env:
          HAS_APP: ${{ secrets.ALGENTA_SDK_SYNC_APP_ID != '' && secrets.ALGENTA_SDK_SYNC_APP_PRIVATE_KEY != '' }}
          HAS_PAT: ${{ secrets.TOOLCHAIN_PROPAGATE_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_APP" = "true" ]; then
            mode=app
          elif [ "$HAS_PAT" = "true" ]; then
            mode=pat
          else
            mode=none
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "credential mode: $mode"

      - name: Explain the skip (no credentials configured)
        if: steps.creds.outputs.mode == 'none'
        run: |
          set -euo pipefail
          msg="no credentials for fan-out. Set ALGENTA_SDK_SYNC_APP_ID + ALGENTA_SDK_SYNC_APP_PRIVATE_KEY (GitHub App, preferred) or TOOLCHAIN_PROPAGATE_TOKEN (fine-grained PAT) on thyn-ai/security-toolchain -- README, 'Running propagate from GitHub Actions'. Until then: scripts/propagate.py locally with gh auth."
          echo "::notice title=propagate::$msg"
          {
            echo "### propagate skipped -- credential mode: none"
            echo
            echo "$msg"
          } >> "$GITHUB_STEP_SUMMARY"

      # `repositories:` is deliberately NOT passed. With `owner` set and no list, the token
      # covers every repository the App installation grants (the action logs "Creating token
      # for all repositories owned by thyn-ai"), narrowed by the permission-* inputs below. A
      # static list copied from fleet.json would make minting fail outright the moment one
      # fleet repository is missing from the installation -- turning a per-repo gap, which
      # propagate.py reports as one FAILED line while the rest fan out, into a total no-op --
      # and could not follow the `repos` dispatch input anyway. A repository the App is not
      # installed on stays unreachable either way.
      - name: Mint a scoped App installation token
        id: app-token
        if: steps.creds.outputs.mode == 'app'
        # A failed mint (the App lacks a permission requested below, is not installed on the
        # org, or the key was rotated) must not end the job on the action's bare error: the
        # Propagate step sees an empty token and explains what to fix.
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The numeric App id (public). v3 marks `app-id` deprecated in favour of `client-id`;
          # both feed the same JWT issuer field, so keeping the sibling workflow's input costs
          # one deprecation annotation and nothing else.
          app-id: ${{ secrets.ALGENTA_SDK_SYNC_APP_ID }}
          private-key: ${{ secrets.ALGENTA_SDK_SYNC_APP_PRIVATE_KEY }}
          owner: thyn-ai
          # Least privilege: what `gh repo clone` + `git push` + `gh pr create` need, plus
          # `workflows` because the bump rewrites .github/workflows/security.yml and GitHub
          # refuses the push without it. The App must hold each of these or minting fails.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-metadata: read

      - name: Propagate
        # An allow-list of the two credentialed modes, not `!= 'none'`: an empty or
        # unexpected mode must never run the fan-out.
        if: steps.creds.outputs.mode == 'app' || steps.creds.outputs.mode == 'pat'
        env:
          MODE: ${{ steps.creds.outputs.mode }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          # the PAT enters this process only when it is the credential in use
          PAT: ${{ steps.creds.outputs.mode == 'pat' && secrets.TOOLCHAIN_PROPAGATE_TOKEN || '' }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          REPOS: ${{ inputs.repos }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--tag "$TAG")
          [ -n "$REPOS" ] && args+=(--repos "$REPOS")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)

          case "$MODE" in
            app)
              if [ -z "${APP_TOKEN:-}" ]; then
                msg="App credentials are set but no installation token was minted (see the step above). Usual causes: the App lacks a permission this run requests (contents write, pull requests write, workflows write), it is not installed on the thyn-ai org, or ALGENTA_SDK_SYNC_APP_PRIVATE_KEY is not the App's current key. README, 'Running propagate from GitHub Actions'."
                echo "::error title=propagate::$msg"
                {
                  echo "### propagate failed -- credential mode: app (token mint failed)"
                  echo
                  echo "$msg"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              export GH_TOKEN="$APP_TOKEN"
              # Commits come from the App's bot user, not from a person and not from an
              # assistant. The noreply address is <bot user id>+<slug>[bot]@..., and the bot
              # user id is not the installation id, so look it up rather than hard-code it.
              bot="${APP_SLUG}[bot]"
              bot_id="$(gh api "users/${bot}" --jq .id)"
              args+=(--git-user "$bot" --git-email "${bot_id}+${bot}@users.noreply.github.com" --no-attribution)
              ;;
            pat)
              export GH_TOKEN="$PAT"
              ;;
          esac

          # `gh repo clone` authenticates through gh, but propagate.py's plain `git push` needs
          # a credential helper: this points git at `gh auth git-credential`, which serves
          # GH_TOKEN, so no token is ever written into a remote URL.
          gh auth setup-git

          log="$RUNNER_TEMP/propagate.log"
          rc=0
          python scripts/propagate.py "${args[@]}" 2>&1 | tee "$log" || rc=$?

          count() { grep -c -E "$1" "$log" || true; }
          {
            echo "### propagate -- credential mode: $MODE"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| tag | \`${TAG:-latest release}\` |"
            echo "| repos | \`${REPOS:-all in fleet.json}\` |"
            echo "| dry run | \`${DRY_RUN:-false}\` |"
            echo "| pull requests opened | $(count '^[^ ]+: https://github\.com/.+/pull/[0-9]+$') |"
            echo "| would change (dry run) | $(count '^[^ ]+: would change ') |"
            echo "| already at tag | $(count '^[^ ]+: already at ') |"
            echo "| skipped by fleet.json | $(count '^[^ ]+: skipped -- ') |"
            echo "| failed | $(count '^[^ ]+: FAILED$') |"
            echo "| propagate.py exit code | $rc |"
            echo
            echo '```text'
            cat "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
