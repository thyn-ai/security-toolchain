# Dependabot configuration.
#
# Every entry carries `cooldown: default-days: 7`: a version bump is proposed only once the
# release is a week old, so a compromised or hastily-yanked upload is caught upstream before it
# reaches a PR here (Dependabot's own default is 3 days). Security updates are never delayed by
# cooldown.
#
# What Dependabot sees in this repository:
#   * .github/workflows/*.yml and action.yml -- the SHA-pinned actions: the `github-actions`
#     entry. Nothing here references thyn-ai/security-toolchain by version: the two reusable
#     workflows install the toolchain from their own commit (tests/test_self_reference.py), so
#     there is no self-reference to exclude.
#   * requirements-dev.txt and requirements-fuzz.txt -- the hash-pinned CI toolchains (pytest,
#     pyyaml, ruff; atheris): the `pip` entry, which updates the `--hash` lines with the version.
#     The package itself has no runtime dependencies (pyproject.toml, `dependencies = []`).
#   * security/toolchain.lock -- the scanner binaries and the opengrep-rules commit: NOT a
#     Dependabot ecosystem. Those pins move through a reviewed pull request that records the
#     upstream checksums (README, "Pinning and verification").
version: 2
updates:
  # GitHub Actions: weekly, grouped into one PR -- the same action is pinned by SHA at several
  # call sites, and one grouped bump is reviewable where a handful of single-action PRs would
  # not be.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore(ci)

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-tools:
        patterns:
          - "*"
    commit-message:
      prefix: chore(dev)
